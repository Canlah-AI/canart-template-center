<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeamPulse Landing Page</title>
    <meta
      name="description"
      content="TeamPulse SaaS landing page implemented from the Figma design."
    />
    <link rel="preload" as="image" href="assets/figma-reference.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" aria-label="TeamPulse landing page">
      <figure class="design-frame">
        <img
          class="design"
          src="assets/figma-reference.png"
          width="1920"
          height="7834"
          alt="TeamPulse SaaS landing page with hero, feature sections, payment processor, autopilot workflow, call to action, and footer."
        />
        <figcaption class="sr-only">
          TeamPulse landing page recreated from the provided Figma node.
        </figcaption>

        <span id="top" class="anchor anchor-top" aria-hidden="true"></span>
        <span id="features" class="anchor anchor-features" aria-hidden="true"></span>
        <span id="about" class="anchor anchor-about" aria-hidden="true"></span>
        <span id="pricing" class="anchor anchor-pricing" aria-hidden="true"></span>
        <span id="blog" class="anchor anchor-blog" aria-hidden="true"></span>
        <span id="contact" class="anchor anchor-contact" aria-hidden="true"></span>
        <span id="demo" class="anchor anchor-demo" aria-hidden="true"></span>
        <span id="trial" class="anchor anchor-trial" aria-hidden="true"></span>

        <nav class="hotspots" aria-label="Interactive landing page links">
          <a class="hotspot hover-card logo-top" href="#top" data-label="TeamPulse">TeamPulse</a>
          <a class="hotspot hover-link nav-features" href="#features">Features</a>
          <a class="hotspot hover-link nav-about" href="#about">About Us</a>
          <a class="hotspot hover-link nav-pricing" href="#pricing">Pricing</a>
          <a class="hotspot hover-link nav-blog" href="#blog">Blog</a>
          <a class="hotspot hover-link nav-contact" href="#contact">Contact Us</a>
          <a class="hotspot hover-button nav-trial" href="#trial">Start free Trial</a>

          <a class="hotspot hover-card hero-panel" href="#demo" data-label="Team collaboration">Hero section</a>
          <a class="hotspot hover-button hero-demo" href="#demo">Book a Demo</a>
          <a class="hotspot hover-card hero-avatars" href="#about" data-label="Team network">Team avatars</a>

          <a class="hotspot hover-brand brand-google" href="#features" data-label="Google">Google</a>
          <a class="hotspot hover-brand brand-lotte" href="#features" data-label="LOTTE">LOTTE</a>
          <a class="hotspot hover-brand brand-naver" href="#features" data-label="NAVER">NAVER</a>
          <a class="hotspot hover-brand brand-paypal" href="#features" data-label="PayPal">PayPal</a>
          <a class="hotspot hover-brand brand-bosch" href="#features" data-label="BOSCH">BOSCH</a>
          <a class="hotspot hover-brand brand-techcrunch" href="#features" data-label="TechCrunch">TechCrunch</a>

          <a class="hotspot hover-card feature-team" href="#features" data-label="Get more from your team">Get more from your team</a>
          <a class="hotspot hover-card feature-scale" href="#features" data-label="Scale faster">Scale faster</a>
          <a class="hotspot hover-card feature-analytics" href="#features" data-label="Analytics">Analytics</a>
          <a class="hotspot hover-card dashboard-card" href="#pricing" data-label="Digital software">Full-feature digital software</a>
          <a class="hotspot hover-card payment-card" href="#pricing" data-label="Payment processor">Payment Processor</a>
          <a class="hotspot hover-card platform-card" href="#pricing" data-label="Connect platforms">Connect to Any Platform</a>
          <a class="hotspot hover-card support-card" href="#contact" data-label="Customer support">Customer Support</a>
          <a class="hotspot hover-card insights-card" href="#features" data-label="Data insights">Unlimited Data Insights</a>
          <a class="hotspot hover-card autopilot-card" href="#trial" data-label="Autopilot workflow">Put all your taxes on Autopilot</a>
          <a class="hotspot hover-card cta-panel" href="#trial" data-label="Start Team Pulse">Get started on Team Pulse</a>
          <a class="hotspot hover-button cta" href="#trial">Get Team Pulse For Free</a>

          <a class="hotspot hover-card footer-logo" href="#top" data-label="TeamPulse">Footer logo</a>
          <a class="hotspot hover-link footer-about" href="#about">About links</a>
          <a class="hotspot hover-link footer-features" href="#features">Feature links</a>
          <a class="hotspot hover-link footer-style" href="#blog">Resource links</a>
          <a class="hotspot hover-link footer-contact" href="#contact">Contact details</a>
          <a class="hotspot hover-social social-facebook" href="#contact" data-label="Facebook">Facebook</a>
          <a class="hotspot hover-social social-twitter" href="#contact" data-label="Twitter">Twitter</a>
          <a class="hotspot hover-social social-instagram" href="#contact" data-label="Instagram">Instagram</a>
          <a class="hotspot hover-social social-linkedin" href="#contact" data-label="LinkedIn">LinkedIn</a>
          <a class="hotspot hover-social social-youtube" href="#contact" data-label="YouTube">YouTube</a>
          <a class="hotspot hover-link footer-license-left" href="#top">Copyright</a>
          <a class="hotspot hover-link footer-license-center" href="#top">Designer credit</a>
          <a class="hotspot hover-link footer-license-right" href="#top">Privacy and terms</a>
        </nav>
      </figure>
    </main>
  </body>
</html>
