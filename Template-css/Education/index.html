    <div class="modal" id="actionModal" hidden>
      <button class="modal-backdrop" type="button" data-close-modal aria-label="Close dialog"></button>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" type="button" data-close-modal aria-label="Close dialog">x</button>
        <p class="modal-kicker">Tinker Sanctuary</p>
        <h2 id="modalTitle">Get help</h2>
        <p id="modalBody">Tell us what kind of support you need and we will guide you to the right session.</p>
        <form class="modal-form" id="supportForm">
          <label>
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" placeholder="Your name" />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com" />
          </label>
          <button class="modal-submit" type="submit">Send request</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
